[package]
name = "tactilegeo"
version = "0.1.0"
description = "TactileGeo desktop app"
edition = "2021"

[build-dependencies]
tauri-build = { version = "=2.7.1", features = [] }

[dependencies]
tauri = { version = "=2.12.1", features = [] }
tauri-plugin-dialog = "=2.8.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
keyring = { version = "=3.6.3", features = ["windows-native"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Security"] }

[profile.release]
opt-level = "s"
lto = true
strip = true
